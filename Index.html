<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>임직원 경품 추첨</title>
<style>
:root{
  --brand-blue:#0C4DE0;
  --brand-blue-deep:#062B85;
  --brand-blue-tint:#E8EFFF;
  --surface:#FFFFFF;
  --ink:#111827;
  --ink-soft:#5A6474;
  --line:#D8E1F5;
  --gold:#FFC53D;
  --amber:#FF9F1C;
  --panel-w:360px;
  --reel-w:232px;
  --reel-h:136px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard","Pretendard Variable",-apple-system,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 700px at 15% -10%, #2D6BFF 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 110%, #0A3AAE 0%, transparent 55%),
    linear-gradient(160deg,#0C4DE0 0%,#0836A3 55%,#062B85 100%);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}

/* ================= layout ================= */
#app{display:flex;height:100vh;width:100vw}

/* ================= side panel ================= */
#panel{
  width:var(--panel-w);flex:0 0 var(--panel-w);height:100%;
  background:var(--surface);display:flex;flex-direction:column;
  box-shadow:6px 0 28px rgba(0,0,0,.28);z-index:40;
  transition:margin-left .35s cubic-bezier(.4,0,.2,1);
}
body.stage-mode #panel{margin-left:calc(-1 * var(--panel-w))}
.panel-head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.logo-row{display:flex;align-items:center;gap:10px}
.logo-row img{height:22px;width:auto}
.logo-row .divider{width:1px;height:16px;background:var(--line)}
.logo-row span{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:-.02em}
.panel-body{flex:1;overflow-y:auto;padding:18px 20px 24px}
.panel-body::-webkit-scrollbar{width:8px}
.panel-body::-webkit-scrollbar-thumb{background:#C9D4EA;border-radius:4px}
.sec{margin-bottom:22px}
.sec h3{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--brand-blue);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.sec h3 .num{width:17px;height:17px;border-radius:5px;background:var(--brand-blue);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;font-style:normal}
textarea#roster{
  width:100%;height:132px;resize:vertical;padding:11px 12px;font-size:13px;line-height:1.55;
  border:1.5px solid var(--line);border-radius:12px;background:#FBFCFE;color:var(--ink);outline:none;transition:border-color .15s,background .15s;
}
textarea#roster:focus{border-color:var(--brand-blue);background:#fff}
textarea#roster::placeholder{color:#A9B4C8}
.hint{font-size:11px;color:var(--ink-soft);margin-top:7px;line-height:1.6}
.row{display:flex;gap:8px;margin-top:9px}
.btn{padding:10px 14px;border-radius:11px;font-size:13px;font-weight:700;letter-spacing:-.01em;transition:transform .1s,filter .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand-blue);color:#fff;flex:1}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--brand-blue-tint);color:var(--brand-blue)}
.btn-ghost:hover{background:#DCE7FF}
.btn-line{background:#fff;color:var(--ink-soft);border:1.5px solid var(--line)}
.btn-line:hover{border-color:#B9C6E2;color:var(--ink)}
.btn-danger{background:#FFF1F0;color:#D93A2F}
.btn-danger:hover{background:#FFE3E0}
.pool-stat{display:flex;align-items:baseline;gap:7px;padding:12px 14px;border-radius:12px;background:var(--brand-blue-tint);margin-top:11px}
.pool-stat b{font-size:24px;color:var(--brand-blue);font-weight:800;letter-spacing:-.03em}
.pool-stat span{font-size:12px;color:#3A5590;font-weight:600}
.pool-stat .sep{margin-left:auto;font-size:11px;color:#6B82B8}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
.field input[type=text]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:13px;background:#FBFCFE;outline:none;color:var(--ink);font-weight:600}
.field input[type=text]:focus{border-color:var(--brand-blue);background:#fff}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:#FBFCFE}
.stepper button{width:40px;height:40px;font-size:19px;font-weight:700;color:var(--brand-blue);display:grid;place-items:center}
.stepper button:hover{background:var(--brand-blue-tint)}
.stepper input{flex:1;text-align:center;border:none;background:transparent;font-size:17px;font-weight:800;color:var(--ink);outline:none;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:700;background:#F2F5FB;color:var(--ink-soft)}
.chip:hover{background:#E9EEF8}
.chip.on{background:var(--brand-blue);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:12.5px;font-weight:600;color:var(--ink)}
.toggle small{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:500;margin-top:2px}
.sw{width:42px;height:24px;border-radius:999px;background:#D5DDEC;position:relative;transition:background .2s;flex:0 0 42px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--brand-blue)}
.sw.on::after{transform:translateX(18px)}
#winnerList{display:flex;flex-direction:column;gap:7px;max-height:260px;overflow-y:auto}
.wrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;background:#F7F9FD;border:1px solid #EAF0FA}
.wrow .rank{font-size:10px;font-weight:800;color:#fff;background:var(--brand-blue);padding:3px 7px;border-radius:6px;white-space:nowrap;max-width:92px;overflow:hidden;text-overflow:ellipsis}
.wrow .nm{font-size:13px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .dp{font-size:10.5px;color:var(--ink-soft);font-weight:500}
.wrow .del{font-size:15px;color:#C3CBD9;padding:0 2px;line-height:1}
.wrow .del:hover{color:#E4483C}
.empty{font-size:12px;color:#A9B4C8;text-align:center;padding:22px 0;font-weight:500}

/* ================= stage ================= */
#stage{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;flex:0 0 auto;z-index:20}
.topbar .brand{display:flex;align-items:center;gap:11px}
.topbar .brand img{height:26px;filter:brightness(0) invert(1);opacity:.96}
.topbar .brand .tag{font-size:11px;font-weight:800;color:#fff;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:7px;letter-spacing:.02em;border:1px solid rgba(255,255,255,.14)}
.topbar .spacer{flex:1}
.pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16);padding:8px 14px;border-radius:999px;color:#fff;font-size:12.5px;font-weight:700}
.pill b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.iconbtn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:15px;transition:background .15s}
.iconbtn:hover{background:rgba(255,255,255,.24)}

.arena{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:4px 20px;min-height:0;overflow:hidden}
.arena-inner{
  display:flex;align-items:flex-end;justify-content:center;
  transform-origin:center center;position:relative;
  padding-top:150px;   /* 하우징 위로 솟은 사자·말풍선 */
}

/* ================= mascots ================= */
.mascot{position:relative;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 20px 26px rgba(2,14,52,.42))}
#rabbit{height:360px;margin-right:-50px;margin-bottom:2px;z-index:8;transform-origin:70% 100%;animation:idleRabbit 2.8s ease-in-out infinite}
#tiger{height:340px;margin-left:-40px;margin-bottom:2px;z-index:8;transform-origin:30% 100%;animation:idleTiger 3.2s ease-in-out infinite}
@keyframes idleRabbit{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg) translateY(-4px)}}
@keyframes idleTiger{0%,100%{transform:rotate(1deg)}50%{transform:rotate(-1deg) translateY(-3px)}}
body.spinning #rabbit{animation:crankRabbit .46s ease-in-out infinite}
body.spinning #tiger{animation:shakeTiger .34s ease-in-out infinite}
@keyframes crankRabbit{0%,100%{transform:rotate(-4deg) translateY(2px)}50%{transform:rotate(1.5deg) translateY(-6px)}}
@keyframes shakeTiger{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg) translateY(-4px)}}
body.win #rabbit{animation:jumpM .6s cubic-bezier(.3,.7,.4,1) 4}
body.win #tiger{animation:jumpM .6s cubic-bezier(.3,.7,.4,1) 4 .12s}
@keyframes jumpM{0%,100%{transform:translateY(0) scale(1)}38%{transform:translateY(-34px) scale(1.05)}}

/* lion: 하우징 뒤에서 몸을 내밀고 깃발을 흔든다 */
.lion-wrap{
  position:absolute;left:50%;width:250px;margin-left:-125px;bottom:calc(100% - 22px);
  z-index:-1;transform-origin:50% 100%;animation:idleLion 2.6s ease-in-out infinite;
}
.lion-wrap img{display:block;width:100%;height:auto;position:relative;filter:drop-shadow(0 10px 16px rgba(2,14,52,.35))}
.lion-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
@keyframes idleLion{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
body.spinning .lion-wrap{animation:cheerLion .42s ease-in-out infinite}
@keyframes cheerLion{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
body.win .lion-wrap{animation:jumpLion .5s cubic-bezier(.3,.7,.4,1) 5}
@keyframes jumpLion{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-30px) scale(1.07)}}

/* speech bubble — 사자 얼굴 오른쪽 위 */
#bubble{
  position:absolute;left:calc(50% + 96px);bottom:calc(100% + 132px);z-index:12;
  background:#fff;color:var(--ink);padding:10px 18px;border-radius:18px 18px 18px 6px;
  font-size:15px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
  box-shadow:0 10px 26px rgba(0,0,0,.24);opacity:0;transform:translateY(8px) scale(.94);transform-origin:0 100%;
  transition:opacity .22s,transform .22s;
}
#bubble.show{opacity:1;transform:translateY(0) scale(1)}

/* ================= machine ================= */
.machine{position:relative;z-index:6;display:flex;align-items:flex-end}
.machine.enter{animation:machineEnter .9s cubic-bezier(.2,.8,.2,1)}
@keyframes machineEnter{0%{transform:scale(1.14);filter:brightness(1.9) saturate(1.2)}100%{transform:scale(1);filter:none}}
.housing{
  background:linear-gradient(180deg,#1B5BEC 0%,var(--brand-blue) 42%,#0A3FC0 100%);
  border-radius:26px;padding:0 0 16px;position:relative;
  box-shadow:0 30px 60px rgba(3,18,60,.5), inset 0 2px 0 rgba(255,255,255,.34), inset 0 -4px 0 rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.2);
  transition:box-shadow .5s;
}
.machine.glow .housing{
  box-shadow:0 0 0 2px rgba(255,200,90,.9), 0 0 40px 8px rgba(255,160,40,.55), 0 30px 60px rgba(3,18,60,.5), inset 0 2px 0 rgba(255,255,255,.34);
}
/* 당첨 후광 — 하우징 뒤 회전 광선 */
.glory{
  position:absolute;left:50%;top:50%;width:1500px;height:1500px;margin:-750px 0 0 -750px;
  z-index:-2;pointer-events:none;opacity:0;transition:opacity .9s;
  background:repeating-conic-gradient(from 0deg,
    rgba(255,176,40,0) 0deg 7deg, rgba(255,196,70,.34) 9deg, rgba(255,150,30,0) 12deg 18deg);
  -webkit-mask-image:radial-gradient(circle, #000 12%, rgba(0,0,0,.55) 30%, transparent 58%);
          mask-image:radial-gradient(circle, #000 12%, rgba(0,0,0,.55) 30%, transparent 58%);
  animation:glorySpin 26s linear infinite;
}
.glory.on{opacity:1}
@keyframes glorySpin{to{transform:rotate(360deg)}}

.brandplate{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 34px 11px;border-bottom:1px solid rgba(255,255,255,.14);position:relative;z-index:2}
.brandplate img{height:22px;filter:brightness(0) invert(1);opacity:.97}
.brandplate .lamp{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);opacity:.55}
body.spinning .brandplate .lamp{animation:lamp .45s linear infinite}
@keyframes lamp{0%,100%{opacity:.25}50%{opacity:1}}
.prizebar{text-align:center;padding:9px 30px 11px}
.prizebar .label{font-size:21px;font-weight:800;color:#fff;letter-spacing:-.02em}
.prizebar .sub{font-size:11px;font-weight:700;color:rgba(255,255,255,.62);margin-top:2px;letter-spacing:.02em}
.reels{display:flex;gap:10px;padding:0 18px;justify-content:center}
/* 이름 박스 + 그 박스에 붙은 빛줄기 캔버스 */
.slot{position:relative;flex:0 0 auto}
.slot > canvas.beam{position:absolute;left:-44px;top:-44px;width:1px;height:1px;pointer-events:none;z-index:4}
.reel{
  position:relative;overflow:hidden;background:#fff;border-radius:14px;
  box-shadow:inset 0 3px 10px rgba(6,30,90,.28), 0 2px 0 rgba(255,255,255,.2);
  height:var(--reel-h);width:var(--reel-w);flex:0 0 auto;transition:box-shadow .3s;
}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:17%;z-index:3;pointer-events:none}
.reel::before{top:0;background:linear-gradient(180deg,rgba(214,227,255,.92),rgba(255,255,255,0))}
.reel::after{bottom:0;background:linear-gradient(0deg,rgba(214,227,255,.92),rgba(255,255,255,0))}
.reel .strip{display:flex;flex-direction:column;will-change:transform}
.reel .strip.fast{filter:blur(2.5px)}
.reel .item{height:var(--reel-h);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;gap:2px}
.reel .item .n{font-size:40px;font-weight:800;letter-spacing:-.035em;color:var(--ink);line-height:1.05;white-space:nowrap}
.reel .item .d{font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.reel.locked{box-shadow:inset 0 0 0 3px var(--gold), inset 0 3px 10px rgba(6,30,90,.2)}
.reel.locked .item .n{color:var(--brand-blue)}
.reel.pop{animation:pop .34s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
.machine.glow .reel.locked{box-shadow:inset 0 0 0 3px #FFB23E, 0 0 22px rgba(255,170,50,.65)}
.baseplate{margin:14px 18px 0;height:8px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.26),rgba(255,255,255,.06))}

/* lever — 토끼 손 위치 */
.lever{position:relative;width:54px;height:134px;margin-right:-2px;margin-bottom:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;z-index:7}
.lever .mount{width:38px;height:22px;border-radius:9px 9px 5px 5px;background:linear-gradient(180deg,#1148CF,#062B85);border:1px solid rgba(255,255,255,.22);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.lever .arm{position:absolute;bottom:14px;width:13px;height:calc(100% - 30px);border-radius:999px;background:linear-gradient(90deg,#FFFFFF,#D3DEF5 42%,#94A9DA);transform-origin:bottom center;transition:transform .45s cubic-bezier(.34,1.4,.5,1);box-shadow:0 3px 12px rgba(0,0,0,.34)}
.lever .knob{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#FFF0BE,var(--gold) 50%,#DE9A0C);box-shadow:0 5px 14px rgba(0,0,0,.38), inset 0 -3px 5px rgba(0,0,0,.2)}
.lever:hover .arm{transform:rotate(7deg)}
body.spinning .lever .arm{transform:rotate(-30deg)}
.lever .hintkey{position:absolute;bottom:-20px;font-size:9.5px;font-weight:800;color:rgba(255,255,255,.5);white-space:nowrap;letter-spacing:.04em}

/* ================= controls ================= */
.controls{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:11px;padding:6px 26px 22px;z-index:20}
.cbtn{padding:14px 30px;border-radius:14px;font-size:15px;font-weight:800;letter-spacing:-.02em;transition:transform .1s,filter .15s,box-shadow .2s;display:flex;align-items:center;gap:8px}
.cbtn:active{transform:scale(.97)}
.cbtn.go{background:#fff;color:var(--brand-blue);box-shadow:0 10px 26px rgba(0,0,0,.26)}
.cbtn.go:hover{box-shadow:0 14px 32px rgba(0,0,0,.32)}
.cbtn.confirm{background:var(--gold);color:#3A2A00;box-shadow:0 10px 26px rgba(0,0,0,.26)}
.cbtn.sub{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.2);padding:14px 20px}
.cbtn.sub:hover{background:rgba(255,255,255,.24)}
.cbtn:disabled{opacity:.34;cursor:not-allowed;transform:none;box-shadow:none}
.kbd{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.09);letter-spacing:.03em}
.cbtn.sub .kbd{background:rgba(255,255,255,.18)}

/* ================= FX canvas / toast / modal ================= */
/* 불꽃놀이는 캐릭터·슬롯머신 뒤 하늘에 */
#fxSky{position:fixed;inset:0;pointer-events:none;z-index:-1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:56}
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,24px);z-index:120;background:#101828;color:#fff;padding:13px 22px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;transition:opacity .22s,transform .22s;box-shadow:0 12px 34px rgba(0,0,0,.4);pointer-events:none;max-width:80vw;text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.warn{background:#B42318}
.modal{position:fixed;inset:0;background:rgba(6,20,52,.62);z-index:130;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:20px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:20px;padding:26px;max-width:460px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.modal h4{font-size:17px;font-weight:800;margin-bottom:9px;letter-spacing:-.02em}
.modal p{font-size:13.5px;color:var(--ink-soft);line-height:1.65;margin-bottom:18px}
.modal .acts{display:flex;gap:9px;justify-content:flex-end}
#finale{position:fixed;inset:0;z-index:110;display:none;flex-direction:column;background:linear-gradient(160deg,#0C4DE0,#062B85);padding:40px;overflow-y:auto}
#finale.show{display:flex}
#finale h2{color:#fff;font-size:clamp(22px,3.4vw,38px);font-weight:800;text-align:center;margin-bottom:26px;letter-spacing:-.03em}
#finale .grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:flex-start;flex:1}
#finale .card{background:#fff;border-radius:16px;padding:15px 22px;min-width:150px;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.24)}
#finale .card .r{font-size:11px;font-weight:800;color:var(--brand-blue);margin-bottom:4px}
#finale .card .n{font-size:clamp(19px,2.5vw,30px);font-weight:800;letter-spacing:-.03em}
#finale .card .d{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:2px}
#finale .close{position:absolute;top:22px;right:26px}

/* ================= INTRO (6초 시네마틱) ================= */
#intro{
  position:fixed;inset:0;z-index:100;display:none;overflow:hidden;
  background:radial-gradient(ellipse at 50% 55%, #0E3AA8 0%, #061A5C 38%, #020A26 75%, #01040F 100%);
}
#intro.show{display:block}
#introCanvas{position:absolute;inset:0;width:100%;height:100%}
.i-rays{
  position:absolute;left:50%;top:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;opacity:0;
  background:repeating-conic-gradient(from 0deg, rgba(120,170,255,0) 0deg 6deg, rgba(150,195,255,.16) 8deg, rgba(120,170,255,0) 11deg 15deg);
  -webkit-mask-image:radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 18%, transparent 46%);
          mask-image:radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 18%, transparent 46%);
}
.i-rays.gold{background:repeating-conic-gradient(from 0deg, rgba(255,180,60,0) 0deg 6deg, rgba(255,200,90,.22) 8deg, rgba(255,160,40,0) 11deg 15deg)}
.i-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.6) 100%);pointer-events:none}
.i-title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;opacity:0}
.i-kicker{display:inline-flex;align-items:center;gap:12px;color:#FFE3A3;font-size:clamp(12px,1.25vw,17px);font-weight:800;letter-spacing:.42em;padding-left:.42em}
.i-kicker img{height:clamp(16px,1.7vw,24px);filter:brightness(0) invert(1)}
.i-kicker i{width:34px;height:1px;background:linear-gradient(90deg,transparent,#FFD27A,transparent)}
.i-prize{
  margin-top:clamp(10px,1.4vw,20px);font-size:clamp(46px,7.2vw,118px);font-weight:900;letter-spacing:-.045em;line-height:1.02;
  background:linear-gradient(180deg,#FFF8E1 0%,#FFE08A 38%,#FFB53D 62%,#FFE7A6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 24px rgba(255,170,50,.35));
  position:relative;display:inline-block;padding:0 .1em;
}
.i-prize .shine{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.95) 48%,transparent 62%);
  -webkit-background-clip:text;background-clip:text;color:transparent;background-size:250% 100%;background-position:150% 0;
}
.i-sub{margin-top:clamp(10px,1.2vw,18px);color:rgba(220,232,255,.86);font-size:clamp(15px,1.7vw,26px);font-weight:700;letter-spacing:-.01em}
.i-sub b{color:#FFD27A}
.i-count{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);pointer-events:none}
.i-num{
  display:block;font-size:clamp(170px,26vh,320px);font-weight:900;line-height:1;letter-spacing:-.06em;opacity:0;
  background:linear-gradient(180deg,#FFFFFF 0%,#FFE9A8 35%,#FFB23E 70%,#FF8A1C 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(255,160,40,.55));
}
.i-ring{position:absolute;left:50%;top:56%;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;border:3px solid rgba(255,210,120,.9);box-shadow:0 0 40px rgba(255,170,60,.7), inset 0 0 40px rgba(255,170,60,.5);opacity:0}
.i-mascot{position:absolute;opacity:0;filter:drop-shadow(0 22px 34px rgba(0,0,0,.55));pointer-events:none}
#iRabbit{height:46vh;left:14vw;bottom:-2vh}
#iTiger{height:44vh;right:13vw;bottom:-2vh}
#iLion{width:34vh;left:50%;margin-left:-17vh;bottom:-4vh}
.i-go{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;opacity:0;
  font-size:clamp(64px,10vw,170px);font-weight:900;letter-spacing:-.05em;
  background:linear-gradient(180deg,#FFFFFF 0%,#FFE9A8 40%,#FFB23E 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 40px rgba(255,170,50,.7));
}
.i-flash{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 52%, #FFFFFF 0%, #FFF3D0 25%, rgba(255,200,110,.85) 50%, rgba(255,170,60,.4) 75%, rgba(255,150,40,0) 100%)}
.i-skip{position:absolute;right:26px;bottom:22px;color:rgba(255,255,255,.4);font-size:11px;font-weight:700;letter-spacing:.06em}

@media (max-width:900px){:root{--panel-w:300px}}
</style>

    <div class="panel-body">
      <div class="sec">
        <h3><i class="num">1</i>명단 등록</h3>
        <textarea id="roster" placeholder="엑셀에서 이름 열을 복사해 붙여넣으세요.&#10;&#10;홍길동&#10;김철수&#10;이영희&#10;&#10;· 탭 구분: 이름 / 소속 / 사번&#10;· 쉼표·세미콜론·줄바꿈 모두 인식"></textarea>
        <div class="row">
          <button class="btn btn-primary" id="btnRegister">명단 등록</button>
          <button class="btn btn-line" id="btnClearRoster">지우기</button>
        </div>
        <div class="pool-stat">
          <b id="statTotal">0</b><span>명 등록</span>
          <span class="sep">남은 인원 <b style="font-size:13px" id="statLeft">0</b>명 · 당첨 <span id="statWon">0</span>명</span>
        </div>
        <p class="hint">명단은 이 브라우저 안에서만 처리되며 외부로 전송되지 않습니다.</p>
      </div>

      <div class="sec">
        <h3><i class="num">2</i>추첨 설정</h3>
        <div class="field">
          <label>경품 / 등수</label>
          <input type="text" id="prizeLabel" value="1등 · 경품" placeholder="예: 1등 · 에어팟 프로">
        </div>
        <div class="field">
          <label>당첨 인원</label>
          <div class="stepper">
            <button id="cntMinus">−</button>
            <input type="text" id="winCount" value="3" inputmode="numeric">
            <button id="cntPlus">+</button>
          </div>
          <div class="chips" id="cntChips">
            <button class="chip" data-n="1">1명</button>
            <button class="chip" data-n="3">3명</button>
            <button class="chip" data-n="5">5명</button>
            <button class="chip" data-n="10">10명</button>
          </div>
        </div>
        <div class="field">
          <label>릴 회전 속도</label>
          <div class="chips" id="speedChips">
            <button class="chip" data-s="fast">빠르게</button>
            <button class="chip on" data-s="normal">보통</button>
            <button class="chip" data-s="slow">길게</button>
          </div>
        </div>
        <div class="toggle">
          <div>오프닝 연출 (6초)<small>추첨 전 카운트다운 영상 · 끄면 바로 회전</small></div>
          <button class="sw on" id="swIntro"></button>
        </div>
        <div class="toggle">
          <div>기당첨자 제외<small>이미 뽑힌 사람은 다음 추첨에서 제외</small></div>
          <button class="sw on" id="swExclude"></button>
        </div>
        <div class="toggle">
          <div>효과음<small>행사장 음향과 겹치면 꺼두세요</small></div>
          <button class="sw on" id="swSound"></button>
        </div>
      </div>

      <div class="sec">
        <h3><i class="num">3</i>당첨자 <span id="winCountBadge" style="margin-left:auto;font-size:11px;color:var(--ink-soft)"></span></h3>
        <div id="winnerList"><div class="empty">아직 당첨자가 없습니다</div></div>
        <div class="row">

          <button class="btn btn-ghost" id="btnFinale">전체 보기</button>

        <div class="row">

        </div>

"use strict";
const $ = id => document.getElementById(id);

/* ============================================================

const KEY = "lxdraw.session.v1";
const S = {
  participants: [], rounds: [],
  settings: { exclude:true, sound:true, speed:"normal", intro:true },
  pending: null, spinning: false, retryCount: 0

/* ============================================================
   2. 공정한 난수 — crypto 기반, 모듈로 편향 제거
   ============================================================ */
function randInt(max){
  if(max <= 0) return 0;
  const limit = Math.floor(0x100000000 / max) * max;
  const buf = new Uint32Array(1); let v;
  do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
  return v % max;
}
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){ const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const rnd = (a, b) => a + Math.random() * (b - a);   // 연출용(추첨과 무관)

/* ============================================================
   3. 명단 파싱
   ============================================================ */
const HEADER_WORDS = ["이름","성명","성함","사번","부서","소속","팀","직급","직책","name","dept","department","employee","no","번호"];
function parseRoster(text){
  const out = [];
  for(const raw of text.split(/\r?\n/)){
    if(!raw.trim()) continue;
    if(raw.includes("\t")){
      const cols = raw.split("\t").map(s => s.trim()).filter((s,i) => i < 3);
      if(cols[0]) out.push({ name: cols[0], dept: cols[1] || "", empNo: cols[2] || "" });
    } else {
      raw.split(/[,;]/).map(s => s.trim()).filter(Boolean).forEach(p => out.push({ name:p, dept:"", empNo:"" }));
    }
  }
  return out;
}
function looksLikeHeader(e){
  const j = (e.name + " " + e.dept + " " + e.empNo).toLowerCase();
  return HEADER_WORDS.some(w => j.includes(w)) && e.name.length <= 8;
}
const keyOf = e => [e.name, e.dept, e.empNo].join("\u0001");

function registerRoster(){
  const text = $("roster").value;
  if(!text.trim()){ toast("명단을 붙여넣어 주세요", true); return; }
  let entries = parseRoster(text);
  if(!entries.length){ toast("인식할 수 있는 이름이 없습니다", true); return; }
  let headerRemoved = false;
  if(entries.length > 1 && looksLikeHeader(entries[0])){ entries.shift(); headerRemoved = true; }
  const seen = new Set(); const uniq = []; let dupes = 0;
  for(const e of entries){ const k = keyOf(e); if(seen.has(k)){ dupes++; continue; } seen.add(k); uniq.push(e); }

  const apply = (list) => {
    S.participants = list.map((e, i) => ({ id:"p"+i+"_"+randInt(1e9), name:e.name, dept:e.dept, empNo:e.empNo, status:"pool" }));
    const cnt = {}; S.participants.forEach(p => cnt[p.name] = (cnt[p.name] || 0) + 1);
    const seenN = {};
    S.participants.forEach(p => {
      if(cnt[p.name] > 1 && !p.dept && !p.empNo){ seenN[p.name] = (seenN[p.name] || 0) + 1; p.display = p.name + "(" + seenN[p.name] + ")"; }
      else p.display = p.name;
    });
    S.rounds = []; S.pending = null;
    render(); save();
    let msg = list.length + "명 등록 완료"; const extra = [];
    if(headerRemoved) extra.push("머리글 1행 제외");
    if(list.length < entries.length) extra.push("중복 " + (entries.length - list.length) + "건 제거");
    if(extra.length) msg += " (" + extra.join(", ") + ")";
    toast(msg); say("준비 완료! 레버를 당겨주세요");
  };
  const step2 = () => {
    if(!dupes) return apply(entries);
    choiceModal("똑같은 이름이 " + dupes + "건 있습니다",
      "명단을 잘못 붙여넣은 것이라면 중복을 지워야 하고, 실제 동명이인이라면 각각 따로 추첨 대상이 되어야 합니다. 어느 쪽인가요?",
      "중복 제거 (" + uniq.length + "명)", () => apply(uniq),
      "동명이인 유지 (" + entries.length + "명)", () => apply(entries));
  };
  if(S.rounds.length) confirmModal("명단을 새로 등록할까요?", "현재 당첨자 " + totalWinners() + "명 기록이 모두 지워집니다.", step2);
  else step2();
}

/* ============================================================
   4. 조회 헬퍼
   ============================================================ */
const pool = () => S.settings.exclude ? S.participants.filter(p => p.status === "pool") : S.participants.slice();
const totalWinners = () => S.rounds.reduce((n, r) => n + r.winners.length, 0);
const getCount = () => Math.max(1, Math.min(10, parseInt($("winCount").value, 10) || 1));
const prizeText = () => $("prizeLabel").value.trim() || "경품";

/* ============================================================
   5. 릴 구성 · 화면 맞춤
   ============================================================ */
const STRIP_LEN = 34;
function reelSize(n){
  if(n <= 3) return { w:232, h:136 };
  if(n <= 5) return { w:206, h:130 };
  if(n <= 7) return { w:180, h:122 };
  return { w:156, h:114 };
}
function fitStage(){
  const inner = document.querySelector(".arena-inner"), arena = document.querySelector(".arena");
  if(!inner || !arena) return;
  inner.style.transform = "scale(1)";
  const cw = inner.offsetWidth, chh = inner.offsetHeight;
  const aw = arena.clientWidth - 24, ah = arena.clientHeight - 8;
  if(!cw || !chh) return;
  const s = Math.min(1.3, aw / cw, ah / chh);
  inner.style.transform = "scale(" + (s > 0 ? s : 1) + ")";
}
function snapReels(){
  document.querySelectorAll(".reel").forEach(reel => {
    const strip = reel.querySelector(".strip");
    if(!strip || !reel.classList.contains("locked")) return;
    strip.style.transition = "none";
    strip.style.transform = "translateY(" + (-(STRIP_LEN - 1) * reel.clientHeight) + "px)";
  });
}
function buildReels(n, winners){
  const wrap = $("reels"), sz = reelSize(n);
  document.documentElement.style.setProperty("--reel-w", sz.w + "px");
  document.documentElement.style.setProperty("--reel-h", sz.h + "px");
  wrap.innerHTML = "";
  const src = S.participants.length ? S.participants : [{ display:"?", idle:true }];
  for(let i = 0; i < n; i++){
    const slot = document.createElement("div"); slot.className = "slot";
    const reel = document.createElement("div"); reel.className = "reel";
    const strip = document.createElement("div"); strip.className = "strip";
    if(winners){
      for(let k = 0; k < STRIP_LEN - 1; k++) strip.appendChild(itemEl(src[randInt(src.length)], sz.w));
      strip.appendChild(itemEl(winners[i], sz.w));
    } else {
      // 대기 중에는 결과로 오해받지 않도록 이름 대신 "?"만 보여준다
      strip.appendChild(itemEl({ display:"?", idle:true }, sz.w));
    }
    reel.appendChild(strip); slot.appendChild(reel);
    const beam = document.createElement("canvas"); beam.className = "beam"; slot.appendChild(beam);
    wrap.appendChild(slot);
  }
  fitStage();
}
function itemEl(p, rw){
  const d = document.createElement("div"); d.className = "item";
  const n = document.createElement("div"); n.className = "n";
  const txt = (p && (p.display || p.name)) || "???";
  n.textContent = txt;
  const base = Math.round(rw * 0.175);
  n.style.fontSize = Math.max(14, Math.min(base, Math.floor((rw - 22) / Math.max(3, txt.length) * 1.02))) + "px";
  if(p && p.idle){ n.style.color = "#B7C7EE"; n.style.fontSize = Math.round(rw * .26) + "px"; }
  d.appendChild(n);
  const sub = (p && (p.dept || p.empNo)) ? [p.dept, p.empNo].filter(Boolean).join(" · ") : "";
  if(sub){ const s = document.createElement("div"); s.className = "d"; s.textContent = sub; d.appendChild(s); }
  return d;
}

/* ============================================================
   6. 추첨 실행
   ============================================================ */
const SPEED = { fast:{base:2000,gap:420}, normal:{base:3200,gap:700}, slow:{base:4400,gap:1000} };

function spin(){
  if(S.spinning) return;
  if(S.pending){ toast("먼저 결과를 확정하거나 다시 돌려주세요", true); return; }
  if(!S.participants.length){ toast("명단을 먼저 등록해 주세요", true); say("명단을 넣어주세요!"); return; }
  const n = getCount(), p = pool();
  if(p.length === 0){ toast("남은 인원이 없습니다", true); say("남은 인원이 없어요"); return; }
  if(p.length < n){ toast("남은 인원 " + p.length + "명 < 당첨 인원 " + n + "명 — 인원수를 줄여주세요", true); say("남은 인원이 부족해요"); return; }
  if(p.length === n){ confirmModal("전원 당첨됩니다", "남은 인원 " + p.length + "명과 당첨 인원이 같습니다. 그대로 진행할까요?", () => doSpin(n, p)); return; }
  doSpin(n, p);
}

function doSpin(n, p){
  // 당첨자는 버튼을 누른 이 순간 확정된다. 이후 연출은 결과를 보여줄 뿐이다.
  const winners = shuffle(p.slice()).slice(0, n);
  S.spinning = true;
  document.body.classList.remove("win");
  clearWinFx();
  setControls();
  buildReels(n, winners);
  ac();                                     // 사용자 클릭 시점에 오디오 활성화
  if(S.settings.intro) playIntro(prizeText(), n, () => startReels(winners, n));
  else startReels(winners, n);
}

function startReels(winners, n){
  document.body.classList.add("spinning");
  say("두구두구두구…", true);
  whirr(true);
  const sp = SPEED[S.settings.speed];
  const reels = [...document.querySelectorAll(".reel")];
  const itemH = reels[0].clientHeight;
  const endY = -(STRIP_LEN - 1) * itemH;
  reels.forEach((reel, i) => {
    const strip = reel.querySelector(".strip");
    const dur = sp.base + i * sp.gap;
    strip.style.transition = "none";
    strip.style.transform = "translateY(0)";
    void strip.offsetHeight;
    strip.classList.add("fast");
    strip.style.transition = "transform " + dur + "ms cubic-bezier(.11,.62,.14,1)";
    strip.style.transform = "translateY(" + endY + "px)";
    setTimeout(() => strip.classList.remove("fast"), Math.max(400, dur - 700));
    if(i === n - 1 && n > 1) setTimeout(() => say("마지막 한 명은…?", true), Math.max(600, dur - 1300));
    setTimeout(() => {
      reel.classList.add("locked", "pop");
      setTimeout(() => reel.classList.remove("pop"), 340);
      sfx.clunk();
      if(i === reels.length - 1) finishSpin(winners, n);
    }, dur + 40);
  });
}

function finishSpin(winners, n){
  whirr(false);
  S.spinning = false;
  document.body.classList.remove("spinning");
  document.body.classList.add("win");
  setTimeout(() => document.body.classList.remove("win"), 2600);
  S.pending = {
    roundId: "r" + Date.now(), prizeLabel: prizeText(), count: n,
    winners: winners.map(w => ({ id:w.id, name:w.name, display:w.display, dept:w.dept, empNo:w.empNo })),
    drawnAt: new Date().toISOString(), retried: S.retryCount > 0
  };
  say("축하합니다! 🎉", true);
  setControls();
  playWinFx();
}

function confirmRound(){
  if(!S.pending) return;
  const r = S.pending;
  r.winners.forEach(w => { const p = S.participants.find(x => x.id === w.id); if(p) p.status = "won"; });
  S.rounds.push(r); S.pending = null; S.retryCount = 0;
  document.querySelectorAll(".reel").forEach(el => el.classList.remove("locked"));
  clearWinFx();
  render(); save(); setControls();
  toast(r.winners.length + "명 확정 · " + r.prizeLabel);
  say("다음 경품을 준비해 주세요!");
  const m = r.prizeLabel.match(/^(\d+)등/);
  if(m){ $("prizeLabel").value = r.prizeLabel.replace(/^\d+등/, (parseInt(m[1], 10) + 1) + "등"); syncStage(); }
}

function retryRound(){
  if(!S.pending) return;
  confirmModal("다시 돌릴까요?", "이번 추첨 결과가 무효 처리되고 재추첨 이력이 결과 파일에 기록됩니다. 공정성 논란을 피하려면 시스템 오류가 아닌 한 권장하지 않습니다.", () => {
    S.pending = null; S.retryCount++;
    document.querySelectorAll(".reel").forEach(el => el.classList.remove("locked"));
    clearWinFx(); setControls(); say("다시 한 번 갑니다!");
  });
}

/* ============================================================
   7. 렌더링
   ============================================================ */
function render(){
  const total = S.participants.length, won = S.participants.filter(p => p.status === "won").length, left = pool().length;
  $("statTotal").textContent = total; $("statLeft").textContent = left; $("statWon").textContent = won;
  $("pillLeft").textContent = left; $("pillWon").textContent = totalWinners();
  const list = $("winnerList"), all = [];
  S.rounds.forEach(r => r.winners.forEach(w => all.push({ r, w })));
  $("winCountBadge").textContent = all.length ? all.length + "명" : "";
  if(!all.length){ list.innerHTML = '<div class="empty">아직 당첨자가 없습니다</div>'; }
  else {
    list.innerHTML = "";
    all.slice().reverse().forEach(({ r, w }) => {
      const row = document.createElement("div"); row.className = "wrow";
      row.innerHTML = '<span class="rank"></span><span class="nm"></span><span class="dp"></span><button class="del" title="무효 처리">✕</button>';
      row.querySelector(".rank").textContent = r.prizeLabel;
      row.querySelector(".nm").textContent = w.display || w.name;
      row.querySelector(".dp").textContent = [w.dept, w.empNo].filter(Boolean).join(" · ");
      row.querySelector(".del").onclick = () => voidWinner(r.roundId, w.id);
      list.appendChild(row);
    });
  }
}
function voidWinner(roundId, pid){
  confirmModal("당첨을 무효 처리할까요?", "해당 인원이 추첨 대상으로 되돌아갑니다.", () => {
    const r = S.rounds.find(x => x.roundId === roundId); if(!r) return;
    r.winners = r.winners.filter(w => w.id !== pid);
    if(!r.winners.length) S.rounds = S.rounds.filter(x => x.roundId !== roundId);
    const p = S.participants.find(x => x.id === pid); if(p) p.status = "pool";
    render(); save(); toast("무효 처리했습니다");
  });
}
function syncStage(){
  $("stagePrize").textContent = prizeText();
  $("stageSub").textContent = "당첨 인원 " + getCount() + "명";
}
function setControls(){
  const spinBtn = $("btnSpin"), okBtn = $("btnConfirm"), reBtn = $("btnRetry");
  if(S.pending){ spinBtn.style.display = "none"; okBtn.style.display = "flex"; reBtn.style.display = "flex"; }
  else { spinBtn.style.display = "flex"; okBtn.style.display = "none"; reBtn.style.display = "none"; spinBtn.disabled = S.spinning; }
}

/* ============================================================
   8. 말풍선
   ============================================================ */
let bubbleTimer = null;
function say(msg, hold){
  const b = $("bubble"); b.textContent = msg; b.classList.add("show");
  clearTimeout(bubbleTimer);
  if(!hold) bubbleTimer = setTimeout(() => b.classList.remove("show"), 3200);
}

/* ============================================================
   9. 사운드 — 전부 Web Audio 합성 (외부 파일 없음)
   ============================================================ */
let AC = null, MASTER = null, NOISE = null;
function ac(){
  if(!AC){
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MASTER = AC.createGain(); MASTER.gain.value = 0.75; MASTER.connect(AC.destination);
    NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NOISE.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if(AC.state === "suspended") AC.resume();
  return AC;
}
const on = () => S.settings.sound;
function noiseSrc(){ const s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true; return s; }
function env(g, t, a, peak, d){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
const sfx = {
  rumble(dur){
    if(!on()) return; const c = ac(), t = c.currentTime;
    const n = noiseSrc(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = "lowpass"; f.frequency.value = 150;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + dur * 0.55); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f).connect(g).connect(MASTER); n.start(t); n.stop(t + dur + .05);
    const o = c.createOscillator(), og = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(38, t); o.frequency.linearRampToValueAtTime(58, t + dur);
    og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.28, t + dur * 0.6); og.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(og).connect(MASTER); o.start(t); o.stop(t + dur + .05);
  },
  boom(power){
    if(!on()) return; const c = ac(), t = c.currentTime, p = power || 1;
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(34, t + .55);
    env(g, t, .006, .75 * p, .7); o.connect(g).connect(MASTER); o.start(t); o.stop(t + .8);
    const n = noiseSrc(), f = c.createBiquadFilter(), ng = c.createGain();
    f.type = "lowpass"; f.frequency.value = 1400; env(ng, t, .002, .45 * p, .16);
    n.connect(f).connect(ng).connect(MASTER); n.start(t); n.stop(t + .25);
  },
  riser(dur){
    if(!on()) return; const c = ac(), t = c.currentTime;
    const n = noiseSrc(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = "bandpass"; f.Q.value = 5; f.frequency.setValueAtTime(260, t); f.frequency.exponentialRampToValueAtTime(6500, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + dur * .95); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + .08);
    n.connect(f).connect(g).connect(MASTER); n.start(t); n.stop(t + dur + .1);
    const o = c.createOscillator(), og = c.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(880, t + dur);
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1800;
    og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.06, t + dur); og.gain.exponentialRampToValueAtTime(0.0001, t + dur + .06);
    o.connect(lp).connect(og).connect(MASTER); o.start(t); o.stop(t + dur + .1);
  },
  crash(){
    if(!on()) return; const c = ac(), t = c.currentTime;
    const n = noiseSrc(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = "highpass"; f.frequency.value = 2600; env(g, t, .004, .42, 2.2);
    n.connect(f).connect(g).connect(MASTER); n.start(t); n.stop(t + 2.4);
    sfx.boom(1.3);
  },
  hit(){ // 카운트다운 타악
    if(!on()) return; sfx.boom(1);
    const c = ac(), t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(110, t + .3);
    env(g, t, .004, .22, .35); o.connect(g).connect(MASTER); o.start(t); o.stop(t + .45);
  },
  clunk(){
    if(!on()) return; const c = ac(), t = c.currentTime;
    [[190,.16],[120,.1]].forEach(([fq, v], i) => {
      const o = c.createOscillator(), g = c.createGain(); o.type = "square"; o.frequency.value = fq;
      env(g, t + i * .04, .003, v, .14); o.connect(g).connect(MASTER); o.start(t + i * .04); o.stop(t + i * .04 + .2);
    });
  },
  fanfare(){
    if(!on()) return; const c = ac(), t = c.currentTime;
    const notes = [[392,0],[523,.12],[659,.24],[784,.36]];
    notes.forEach(([f, dt]) => brass(f, t + dt, .28, .09));
    [523, 659, 784, 1047].forEach(f => brass(f, t + .52, 1.5, .07));
    function brass(f, st, dur, v){
      const o = c.createOscillator(), o2 = c.createOscillator(), lp = c.createBiquadFilter(), g = c.createGain();
      o.type = "sawtooth"; o2.type = "sawtooth"; o.frequency.value = f; o2.frequency.value = f * 1.004;
      lp.type = "lowpass"; lp.frequency.setValueAtTime(900, st); lp.frequency.linearRampToValueAtTime(3200, st + .08);
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(v, st + .03);
      g.gain.setValueAtTime(v, st + dur * .7); g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
      o.connect(lp); o2.connect(lp); lp.connect(g).connect(MASTER);
      o.start(st); o2.start(st); o.stop(st + dur + .05); o2.stop(st + dur + .05);
    }
  },
  shimmer(dur){
    if(!on()) return; const c = ac(), t = c.currentTime;
    for(let i = 0; i < 14; i++){
      const o = c.createOscillator(), g = c.createGain(), st = t + i * dur / 14;
      o.type = "sine"; o.frequency.value = 1200 + i * 110 + Math.random() * 60;
      env(g, st, .01, .035, .3); o.connect(g).connect(MASTER); o.start(st); o.stop(st + .35);
    }
  },
  launch(){
    if(!on()) return; const c = ac(), t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(500, t); o.frequency.exponentialRampToValueAtTime(1600, t + .5);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.045, t + .08); g.gain.exponentialRampToValueAtTime(0.0001, t + .55);
    o.connect(g).connect(MASTER); o.start(t); o.stop(t + .6);
  },
  pop(bright){
    if(!on()) return; const c = ac(), t = c.currentTime;
    const n = noiseSrc(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = "lowpass"; f.frequency.value = 2000 + Math.random() * 600; env(g, t, .002, .4, .55);
    n.connect(f).connect(g).connect(MASTER); n.start(t); n.stop(t + .65);
    const o = c.createOscillator(), og = c.createGain();   // 몸통 울림
    o.type = "sine"; o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(40, t + .3);
    env(og, t, .004, .22, .35); o.connect(og).connect(MASTER); o.start(t); o.stop(t + .4);
    sfx.crackle(bright ? 1.4 : .7);
  },
  crackle(amount){ // 파지직
    if(!on()) return; const c = ac(), t = c.currentTime, n = Math.round(10 * (amount || 1));
    for(let i = 0; i < n; i++){
      const st = t + .12 + Math.random() * .8, cn = noiseSrc(), hp = c.createBiquadFilter(), cg = c.createGain();
      hp.type = "highpass"; hp.frequency.value = 2800 + Math.random() * 2000; env(cg, st, .001, .05 + Math.random() * .04, .03);
      cn.connect(hp).connect(cg).connect(MASTER); cn.start(st); cn.stop(st + .05);
    }
  }
};
let whirrNode = null, whirrGain = null;
function whirr(onn){
  if(onn && on()){
    const c = ac(); whirrNode = c.createOscillator(); whirrGain = c.createGain();
    whirrNode.type = "sawtooth"; whirrNode.frequency.setValueAtTime(58, c.currentTime);
    whirrGain.gain.setValueAtTime(0.03, c.currentTime);
    whirrNode.connect(whirrGain).connect(MASTER); whirrNode.start();
  } else if(whirrNode){
    try{ whirrGain.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + .25); whirrNode.stop(AC.currentTime + .3); }catch(e){}
    whirrNode = null;
  }
}

   10. 오프닝 시네마틱 (6초)
       0.0  암전 · 저음 럼블 · 별빛 흐름
       0.5  경품 타이틀 등장 + 빛 스윕

       5.2  "추첨 시작!" 폭발 + 워프

   ============================================================ */
const ic = $("introCanvas"), ictx = ic.getContext("2d");
let stars = [], warp = 0.25, introRaf = null, introShake = 0;
function initStars(){
  ic.width = innerWidth * devicePixelRatio; ic.height = innerHeight * devicePixelRatio;
  stars = [];
  for(let i = 0; i < 420; i++) stars.push(newStar(true));
}
function newStar(anywhere){
  return { a: Math.random() * Math.PI * 2, r: anywhere ? Math.random() * Math.hypot(innerWidth, innerHeight) / 2 : rnd(2, 40),
           v: rnd(.4, 1.6), s: rnd(.6, 2.2), c: Math.random() < .72 ? [255, 214, 140] : [190, 215, 255] };
}
function introLoop(){
  const dpr = devicePixelRatio, W = ic.width, H = ic.height, cx = W / 2, cy = H * .52;
  ictx.setTransform(1, 0, 0, 1, 0, 0);
  ictx.clearRect(0, 0, W, H);
  ictx.globalCompositeOperation = "lighter";
  const maxR = Math.hypot(W, H) / 2 / dpr;
  for(const st of stars){
    const dr = st.v * warp * (1 + st.r / 140);
    const r0 = st.r; st.r += dr;
    if(st.r > maxR + 40){ Object.assign(st, newStar(false)); continue; }
    const len = Math.max(1.2, dr * 5.5);
    const x1 = cx + Math.cos(st.a) * st.r * dpr, y1 = cy + Math.sin(st.a) * st.r * dpr;
    const x0 = cx + Math.cos(st.a) * Math.max(0, st.r - len) * dpr, y0 = cy + Math.sin(st.a) * Math.max(0, st.r - len) * dpr;
    const al = Math.min(1, st.r / 160) * .9;
    ictx.strokeStyle = "rgba(" + st.c[0] + "," + st.c[1] + "," + st.c[2] + "," + al + ")";
    ictx.lineWidth = st.s * dpr * (warp > 2 ? 1.3 : 1);
    ictx.beginPath(); ictx.moveTo(x0, y0); ictx.lineTo(x1, y1); ictx.stroke();
  }
  // 버스트 입자
  for(const p of burstP){
    p.vx *= .965; p.vy *= .965; p.vy += .05; p.x += p.vx; p.y += p.vy; p.life--;
    ictx.strokeStyle = "rgba(255," + (190 + (p.hue|0)) + ",110," + Math.max(0, p.life / p.max) + ")";
    ictx.lineWidth = 2.2 * dpr;
    ictx.beginPath(); ictx.moveTo((p.x - p.vx * 3) * dpr, (p.y - p.vy * 3) * dpr); ictx.lineTo(p.x * dpr, p.y * dpr); ictx.stroke();
  }
  burstP = burstP.filter(p => p.life > 0);
  if(introShake > 0){
    const m = introShake; introShake *= .86; if(introShake < .3) introShake = 0;
    $("intro").style.transform = "translate(" + rnd(-m, m) + "px," + rnd(-m, m) + "px)";
  } else $("intro").style.transform = "";
  introRaf = requestAnimationFrame(introLoop);
}
let burstP = [];
function introBurst(){
  const cx = innerWidth / 2, cy = innerHeight * .52;
  for(let i = 0; i < 160; i++){
    const a = Math.random() * Math.PI * 2, sp = rnd(4, 16);
    burstP.push({ x:cx, y:cy, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, life:rnd(40, 75), max:75, hue:rnd(0, 50) });
  }
}

/* ============================================================
   11. 당첨 연출
       0.0s  주황·노랑 빛줄기 2개가 각 이름 박스 양옆에서 출발해 테두리를 한 바퀴
       0~3s  당첨자 이름이 박동하며 점점 커지는 펄스
       2.0s  한 바퀴 완료 → 박스 점화(불티·파동·섬광) + 슬롯머신 위에서 로켓 5연발
       3~6s  연속 불꽃놀이 · 6.3s 피날레 + 황금 커튼

   [구조] 빛줄기는 각 이름 박스(.slot) 안에 붙은 전용 캔버스(canvas.beam)에 박스 기준 좌표로 그린다.
          박스와 같은 요소 안에 있으므로 확대·축소, 패널 접기, 전체화면, 창 크기 변경에도
          항상 박스와 함께 움직이고 커진다. 불꽃놀이만 화면 뒤 하늘 캔버스(#fxSky)에 그린다.
   ============================================================ */
const fxs = $("fxSky"), sctx = fxs.getContext("2d");       // 뒤: 불꽃놀이
let FXS = null, fxRaf = null, fxTimers = [];
function sizeFx(){ fxs.width = Math.round(innerWidth * devicePixelRatio); fxs.height = Math.round(innerHeight * devicePixelRatio); }
sizeFx();
const BEAM_M = 44, BEAM_MB = 120;   // 박스 캔버스 여백: 좌·우·위 / 아래(떨어지는 불티용)

function rrPath(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  const segs = [], ah = Math.PI / 2 * r;
  const L = (x0, y0, x1, y1) => segs.push({ t:"l", x0, y0, x1, y1, len:Math.hypot(x1 - x0, y1 - y0) });
  const A = (cx, cy, a0) => segs.push({ t:"a", cx, cy, a0, len:ah });
  L(x + r, y, x + w - r, y);           A(x + w - r, y + r, -Math.PI / 2);
  L(x + w, y + r, x + w, y + h - r);   A(x + w - r, y + h - r, 0);
  L(x + w - r, y + h, x + r, y + h);   A(x + r, y + h - r, Math.PI / 2);
  L(x, y + h - r, x, y + r);           A(x + r, y + r, Math.PI);
  const total = segs.reduce((s, g) => s + g.len, 0);
  function pt(s){
    s = ((s % total) + total) % total;
    for(const g of segs){
      if(s <= g.len){
        if(g.t === "l"){ const k = g.len ? s / g.len : 0; return [g.x0 + (g.x1 - g.x0) * k, g.y0 + (g.y1 - g.y0) * k]; }
        const a = g.a0 + (s / g.len) * Math.PI / 2; return [g.cx + Math.cos(a) * r, g.cy + Math.sin(a) * r];
      }
      s -= g.len;
    }
    return [x, y];
  }
  const sRightMid = (w - 2 * r) + ah + (h - 2 * r) / 2;
  const sLeftMid = sRightMid + (h - 2 * r) / 2 + ah + (w - 2 * r) + ah + (h - 2 * r) / 2;
  return { total, pt, sRightMid, sLeftMid, x, y, w, h, r };
}
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const fxScale = () => Math.max(.8, Math.min(1.5, innerWidth / 1400));
const PAL = { gold:"#FFD166", amber:"#FFB703", orange:"#FF9F1C", cream:"#FFF4D6", pale:"#FFE8A3", pink:"#FF8FB1",
              rose:"#FF5C8A", sky:"#7FB8FF", mint:"#7DF2C8", violet:"#B58CFF", white:"#FFFFFF", red:"#FF5A4E" };
const COMBOS = [["gold","orange"],["pale","amber"],["pink","gold"],["sky","white"],["mint","gold"],["violet","pink"],["rose","pale"],["cream","orange"],["sky","pale"]];
const RAINBOW = ["#FF5A4E","#FF9F1C","#FFD166","#7DF2C8","#7FB8FF","#B58CFF","#FF8FB1"];
const WARM = ["#FFD166","#FFB703","#FF9F1C","#FFE8A3","#FFF4D6"];
const pick = a => a[(Math.random() * a.length) | 0];
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; }

/* ---------- 당첨자 이름 펄스 (3초, 박동하며 점점 확대) ---------- */
function pulseNames(){
  document.querySelectorAll(".reel").forEach((reel, i) => {
    const item = reel.querySelector(".item:last-child"); if(!item) return;
    const n = item.querySelector(".n"); if(!n) return;
    const avail = reel.clientWidth - 16, w = n.offsetWidth || 1;
    let peak = Math.min(1.32, avail / w);
    if(item.querySelector(".d")) peak = Math.min(peak, 1.2);
    peak = Math.max(1.04, peak);
    const settle = Math.min(1.14, peak);
    const S = f => "scale(" + (1 + (peak - 1) * f).toFixed(3) + ")";
    const G1 = "0 0 22px rgba(255,176,50,.95), 0 0 6px rgba(255,226,150,.95)";
    const G0 = "0 0 0 rgba(255,176,50,0)";
    n.animate([
      { transform:"scale(1)", textShadow:G0, offset:0 },
      { transform:S(.42), textShadow:G1, offset:.13 },
      { transform:S(.22), textShadow:G0, offset:.3 },
      { transform:S(.72), textShadow:G1, offset:.46 },
      { transform:S(.5),  textShadow:G0, offset:.63 },
      { transform:S(1),   textShadow:G1, offset:.8 },
      { transform:"scale(" + settle + ")", textShadow:"0 0 14px rgba(255,176,50,.55)", offset:1 }
    ], { duration:3000, delay:i * 40, easing:"ease-in-out", fill:"forwards" });
    const B1 = "inset 0 0 0 3px #FFB23E, 0 0 34px 6px rgba(255,170,50,.8)", B0 = "inset 0 0 0 3px #FFC53D, 0 0 10px rgba(255,170,50,.3)";
    reel.animate([
      { boxShadow:B0, offset:0 }, { boxShadow:B1, offset:.13 }, { boxShadow:B0, offset:.3 },
      { boxShadow:B1, offset:.46 }, { boxShadow:B0, offset:.63 }, { boxShadow:B1, offset:.8 }, { boxShadow:B0, offset:1 }
    ], { duration:3000, delay:i * 40, easing:"ease-in-out" });
  });
}
function clearPulse(){
  document.querySelectorAll(".reel, .reel .n").forEach(el => el.getAnimations().forEach(a => { if(a.effect && a.effect.getKeyframes().some(k => k.textShadow || k.boxShadow)) a.cancel(); }));
}

/* ---------- 이름 박스 1개의 빛줄기 무대 ---------- */
function makeBox(slot){
  const reel = slot.querySelector(".reel"), cv = slot.querySelector("canvas.beam");
  const W = reel.offsetWidth, H = reel.offsetHeight;                  // 레이아웃 크기 — 확대·축소 영향 없음
  const rad = parseFloat(getComputedStyle(reel).borderTopLeftRadius) || 14;
  const pad = 0;                                                     // 선 중심을 박스 가장자리 위에 정확히
  const k = Math.max(.6, Math.min(1.3, H / 136));
  const cw = W + BEAM_M * 2, ch = H + BEAM_M + BEAM_MB;
  cv.style.width = cw + "px"; cv.style.height = ch + "px";
  cv.style.left = -BEAM_M + "px"; cv.style.top = -BEAM_M + "px";
  const path = rrPath(BEAM_M - pad, BEAM_M - pad, W + pad * 2, H + pad * 2, rad + pad);
  return { slot, reel, cv, ctx:cv.getContext("2d"), W, H, cw, ch, k, path, dens:0,
           lit:new Float32Array(120), sparks:[], pulses:[], flashes:[],
           comets:[ { s0:path.sLeftMid, last:path.sLeftMid }, { s0:path.sRightMid, last:path.sRightMid } ] };
}
// 박스가 화면에서 커지거나 작아지면 캔버스 해상도만 맞춘다(좌표는 늘 박스 기준)
function prepBox(B){
  const r = B.cv.getBoundingClientRect();
  const dens = Math.max(1, Math.min(4, (r.width / B.cw || 1) * devicePixelRatio));
  if(!B.dens || Math.abs(dens - B.dens) / B.dens > .08){
    B.dens = dens; B.cv.width = Math.round(B.cw * dens); B.cv.height = Math.round(B.ch * dens);
  }
  const c = B.ctx;
  c.setTransform(B.cv.width / B.cw, 0, 0, B.cv.height / B.ch, 0, 0);
  c.clearRect(0, 0, B.cw, B.ch);
  c.globalCompositeOperation = "lighter"; c.lineCap = "round"; c.lineJoin = "round";
}
function rrStroke(c, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); c.stroke();
}

/* ---------- 하늘 캔버스 좌표 (화면 확대·축소를 보정) ---------- */
function skyGeom(){
  const cr = fxs.getBoundingClientRect();
  const sx = innerWidth / (cr.width || innerWidth), sy = innerHeight / (cr.height || innerHeight);
  const hr = $("housing").getBoundingClientRect(), st = $("stage").getBoundingClientRect();
  const H = { left:(hr.left - cr.left) * sx, top:(hr.top - cr.top) * sy, width:hr.width * sx, height:hr.height * sy };
  H.right = H.left + H.width; H.bottom = H.top + H.height;
  return { H, stageL:Math.max(0, (st.left - cr.left) * sx) };
}
const refreshSky = () => { if(FXS) Object.assign(FXS, skyGeom()); };

/* ---------- 연출 시작 ---------- */
function playWinFx(){

  FXS = Object.assign({ t0:performance.now(), lap:2000, boxes, skySparks:[], rockets:[], parts:[], flashes:[], launched:false }, skyGeom());
