  pulseNames();
  cancelAnimationFrame(fxRaf); fxLoop();

  // 연속 불꽃놀이 (3.0 ~ 6.0s)
  const show = [
    [3000, "palm", -1], [3200, "ring", 1], [3420, "willow", 0], [3620, "crossette", -1],
    [3820, "glitter", 1], [4050, "dring", 0], [4280, "chrys", -1], [4480, "crackle", 1],
    [4700, "heart", 0], [4920, "palm", 1], [5120, "rainbow", -1], [5330, "willow", 0],
    [5540, "ring", 1], [5720, "chrys", -1], [5880, "rainbow", 1]
  ];
  show.forEach(([t, kind, side]) => fxTimers.push(setTimeout(() => {
    if(!FXS) return; refreshSky();
    const x = skyX(side), y = skyY();
    if(side === 0 || Math.random() < .35) burst(x, y, kind);
    else rocket(x, launchY(x), x + rnd(-50, 50), y, kind);
  }, t)));
  // 피날레 (6.3s) — 일제 발사 + 황금 커튼
  const fin = [["peony",.08],["chrys",.22],["rainbow",.36],["heart",.5],["rainbow",.64],["chrys",.78],["peony",.92]];
  fin.forEach(([kind, fxp], i) => fxTimers.push(setTimeout(() => {
    if(!FXS) return; refreshSky();
    burst(FXS.stageL + (innerWidth - FXS.stageL) * fxp, skyY(), kind, kind === "heart" ? 1.35 : 1.15);
  }, 6300 + i * 70)));
  fxTimers.push(setTimeout(() => {
    if(!FXS) return;
    goldCurtain();
    FXS.flashes.push({ x:innerWidth / 2, y:innerHeight * .35, life:28, max:28, rad:Math.max(innerWidth, innerHeight) * .75 });
    sfx.boom(1.4); sfx.crackle(1.6);
  }, 6450));
  [6900, 7050, 7200, 7350].forEach((t, i) => fxTimers.push(setTimeout(() => {
    if(!FXS) return; refreshSky();
    burst(FXS.stageL + (innerWidth - FXS.stageL) * [.18, .82, .38, .62][i], skyY() * .8, "willow", 1.1);
  }, t)));
  fxTimers.push(setTimeout(() => { $("glory").classList.remove("on"); $("machine").classList.remove("glow"); }, 9200));
}
function clearWinFx(){
  fxTimers.forEach(clearTimeout); fxTimers = [];
  cancelAnimationFrame(fxRaf); fxRaf = null; FXS = null;
  sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, fxs.width, fxs.height);
  document.querySelectorAll("canvas.beam").forEach(cv => { const c = cv.getContext("2d"); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); });
  $("glory").classList.remove("on"); $("machine").classList.remove("glow");
  clearPulse();
}

/* ---------- 위치 헬퍼 (하늘 캔버스 단위) ---------- */
function skyX(side){
  const F = FXS, H = F.H, cx = H.left + H.width / 2;
  const span = Math.max(H.width * .5, (innerWidth - F.stageL) * .38);
  const x = side === 0 ? cx + rnd(-H.width * .12, H.width * .12) : cx + side * rnd(span * .25, span);
  return Math.max(F.stageL + 70, Math.min(innerWidth - 70, x));
}
function skyY(){
  const top = 70, bottom = Math.max(top + 90, FXS.H.top - 40);
  return rnd(top, bottom);
}
// 슬롯머신 폭 안쪽은 하우징 윗면에서, 바깥은 화면 아래에서 발사
function launchY(x){ const H = FXS.H; return (x > H.left + 20 && x < H.right - 20) ? H.top + 6 : innerHeight + 12; }

/* ---------- 로켓 / 폭죽 ---------- */
function rocket(x0, y0, x1, y1, kind){
  if(!FXS) return;
  if(x1 == null) x1 = x0 + rnd(-40, 40);
  const T = Math.max(24, Math.min(46, Math.abs(y1 - y0) / 14));
  FXS.rockets.push({ x:x0, y:y0, vx:(x1 - x0) / T, vy:(y1 - y0) / T - .5 * .12 * T, g:.12, t:0, T, trail:[], kind });
  sfx.launch();
}
function P0(x, y, vx, vy, o){
  return Object.assign({ x, y, vx, vy, drag:.956, g:.07, life:rnd(62, 94), max:94, c:"#FFD166", w:2.4, trail:[], tl:6 }, o);
}
function burst(x, y, kind, size){
  if(!FXS) return;
  const F = FXS, k = fxScale() * (size || 1);
  const [a1, a2] = pick(COMBOS), c1 = PAL[a1], c2 = PAL[a2];
  const out = [];
  const tilt = rnd(0, Math.PI), squash = rnd(.45, .7);
  const ringV = (a, sp) => { const ex = Math.cos(a) * sp, ey = Math.sin(a) * sp * squash;
    return [ex * Math.cos(tilt) - ey * Math.sin(tilt), ex * Math.sin(tilt) + ey * Math.cos(tilt)]; };
  switch(kind){
    case "ring": {
      const n = 130;
      for(let i = 0; i < n; i++){ const [vx, vy] = ringV(i / n * Math.PI * 2, 7.6 * k); out.push(P0(x, y, vx, vy, { c:i % 2 ? c1 : c2, drag:.958, g:.05, tl:3, w:2 })); }
      break;
    }
    case "dring": {
      for(let i = 0; i < 120; i++){ const [vx, vy] = ringV(i / 120 * Math.PI * 2, 8 * k); out.push(P0(x, y, vx, vy, { c:c1, drag:.958, g:.05, tl:3, w:2 })); }
      for(let i = 0; i < 80; i++){ const [vx, vy] = ringV(i / 80 * Math.PI * 2 + .04, 4.8 * k); out.push(P0(x, y, vx, vy, { c:c2, drag:.958, g:.05, tl:3, w:2 })); }
      for(let i = 0; i < 40; i++){ const a = Math.random() * Math.PI * 2, sp = rnd(0, 2.4) * k; out.push(P0(x, y, Math.cos(a) * sp, Math.sin(a) * sp, { c:"#FFFFFF", w:1.6, tw:true })); }
      break;
    }
    case "heart": {
      const n = 130;
      for(let i = 0; i < n; i++){
        const t = i / n * Math.PI * 2;
        const hx = 16 * Math.pow(Math.sin(t), 3), hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        out.push(P0(x, y, hx * .5 * k, hy * .5 * k, { c:i % 3 ? PAL.rose : PAL.pink, drag:.95, g:.028, life:rnd(80, 100), max:100, w:2.8 }));
      }
      for(let i = 0; i < 60; i++){ const a = Math.random() * Math.PI * 2, sp = rnd(0, 3.2) * k; out.push(P0(x, y, Math.cos(a) * sp, Math.sin(a) * sp, { c:PAL.pale, w:1.6, tw:true, g:.03 })); }
      break;
    }
    case "palm": {
      for(let i = 0; i < 10; i++){
        const a = -Math.PI / 2 + (i - 4.5) / 4.5 * 1.35 + rnd(-.08, .08), sp = rnd(7.2, 8.6) * k;
        out.push(P0(x, y, Math.cos(a) * sp, Math.sin(a) * sp, { c:PAL.gold, drag:.982, g:.075, life:rnd(95, 120), max:120, w:4.4, tl:18, shed:true }));
      }
      break;
    }
    case "willow": {
      for(let i = 0; i < 120; i++){
        const a = i / 120 * Math.PI * 2 + rnd(-.03, .03), sp = rnd(2.6, 5.2) * k;
        out.push(P0(x, y, Math.cos(a) * sp, Math.sin(a) * sp, { c:i % 4 ? "#FFC247" : PAL.pale, drag:.976, g:.05, life:rnd(110, 150), max:150, w:1.9, tl:12, shed:Math.random() < .3 }));
      }
      break;
    }
    case "crossette": {
      for(let i = 0; i < 26; i++){
        const a = i / 26 * Math.PI * 2, sp = 6.2 * k;
        out.push(P0(x, y, Math.cos(a) * sp, Math.sin(a) * sp, { c:c1, w:3, tl:8, split:c2, life:80, max:80 }));
      }
      break;
    }
    case "chrys": {
      for(let i = 0; i < 170; i++){
        const a = i / 170 * Math.PI * 2 + rnd(-.02, .02), sp = rnd(7.4, 9.2) * k;
        out.push(P0(x, y, Math.cos(a) * sp, Math.sin(a) * sp, { c:i % 3 ? c1 : c2, tl:11, shed:Math.random() < .35, life:rnd(70, 95), max:95 }));
      }
      break;
    }
    case "glitter": case "crackle": case "rainbow": case "peony": default: {
      const n = kind === "crackle" ? 110 : 190;
      for(let i = 0; i < n; i++){
        const a = i / n * Math.PI * 2 + rnd(-.05, .05), sp = (Math.sqrt(Math.random()) * 8.8 + .6) * k;
        const c = kind === "rainbow" ? RAINBOW[i % RAINBOW.length] : kind === "glitter" ? (i % 2 ? PAL.white : PAL.pale) : (i % 3 ? c1 : c2);
        out.push(P0(x, y, Math.cos(a) * sp, Math.sin(a) * sp, { c, tw:kind === "glitter" || Math.random() < .25, crackle:kind === "crackle" }));
      }
    }
  }
  for(const p of out) F.parts.push(p);
  F.flashes.push({ x, y, life:16, max:16, rad:(kind === "palm" || kind === "willow" ? 110 : 170) * k });
  if(F.parts.length > 5200) F.parts.splice(0, F.parts.length - 5200);
  sfx.pop(kind === "crackle" || kind === "glitter");
}
function sparkRing(B, x, y, n){
  for(let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2, sp = rnd(2.4, 4.4) * B.k;
    B.sparks.push({ x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, g:.06, life:rnd(24, 40), max:40, c:pick(WARM) });
  }
}
function goldCurtain(){
  const L = FXS.stageL;
  for(let i = 0; i < 360; i++){
    FXS.skySparks.push({ x:rnd(L + 20, innerWidth - 20), y:rnd(10, 110), vx:rnd(-.25, .25), vy:rnd(0, 1.2), g:rnd(.02, .045),
                      life:rnd(110, 180), max:180, c:Math.random() < .7 ? "#FFD166" : "#FFF4D6", len:4 });
  }
}

/* ---------- 박스 점화 (한 바퀴 완료 순간) ---------- */
function ignite(F){
  for(const B of F.boxes){
    B.lit.fill(1);
    for(const c of B.comets){ const [hx, hy] = B.path.pt(c.s); sparkRing(B, hx, hy, Math.round(30 * B.k)); }
    const m = Math.round(46 * B.k);
    for(let i = 0; i < m; i++){
      const [x, y] = B.path.pt(rnd(0, B.path.total));
      B.sparks.push({ x, y, vx:rnd(-1.2, 1.2), vy:rnd(-2, .4), g:rnd(.05, .09), life:rnd(34, 70), max:70, c:pick(WARM) });
    }
    B.pulses.push({ d:0, life:34, max:34 });
    B.flashes.push({ x:BEAM_M + B.W / 2, y:BEAM_M + B.H / 2, life:16, max:16, rad:B.W / 2 + BEAM_M * .8 });
  }
  sfx.boom(1.25);
  refreshSky();
  const H = F.H, xs = [.12, .31, .5, .69, .88], kinds = ["chrys", "crossette", "heart", "dring", "peony"];
  xs.forEach((p, i) => fxTimers.push(setTimeout(() => {
    if(!FXS) return;
    const x = H.left + H.width * p;
    rocket(x, H.top + 6, x + (p - .5) * rnd(80, 200), skyY(), kinds[i]);
  }, i * 110)));
}

/* ---------- 박스 빛줄기 그리기 (박스 기준 좌표) ---------- */
const LIT_BUCKETS = 8;
function drawBox(B, t, fadeIn){
  const c = B.ctx, P = B.path, L = P.total, N = B.lit.length, k = B.k;
  for(let i = 0; i < N; i++) B.lit[i] *= .966;
  if(t < 1){
    for(const cm of B.comets){
      const s = cm.s0 + L * easeIO(t);
      let a = cm.last, b = s; if(b < a) b += L;
      for(let q = a; q <= b; q += L / N / 2) B.lit[Math.floor((((q % L) + L) % L) / L * N) % N] = 1;
      cm.last = s; cm.s = s;
    }
  }
  // 잔광
  const passes = [[14 * k, "255,140,30", .22], [5 * k, "255,196,80", .45], [1.9 * k, "255,242,190", .95]];
  for(const [lw, rgb, am] of passes){
    c.lineWidth = lw;
    for(let bkt = 1; bkt <= LIT_BUCKETS; bkt++){
      const lo = (bkt - 1) / LIT_BUCKETS, hi = bkt / LIT_BUCKETS;
      let any = false;
      c.beginPath();
      for(let i = 0; i < N; i++){
        const v = B.lit[i]; if(v < .02 || v <= lo || v > hi) continue;
        const [x0, y0] = P.pt(i / N * L), [x1, y1] = P.pt((i + 1.15) / N * L);
        c.moveTo(x0, y0); c.lineTo(x1, y1); any = true;
      }
      if(any){ c.strokeStyle = "rgba(" + rgb + "," + (hi * am) + ")"; c.stroke(); }
    }
  }
  if(t >= 1) return;
  // 혜성 — 주황 꼬리에서 노랑, 머리는 백열
  const speedK = Math.sin(Math.PI * t);
  for(const cm of B.comets){
    const tail = L * (.12 + .24 * speedK), steps = 26;
    for(let pass = 0; pass < 2; pass++){
      for(let q = steps; q >= 1; q--){
        const f = 1 - q / steps;
        const [x0, y0] = P.pt(cm.s - tail * (q / steps)), [x1, y1] = P.pt(cm.s - tail * ((q - 1) / steps));
        if(pass === 0){ c.strokeStyle = "rgba(255," + Math.round(110 + 60 * f) + ",20," + (f * .3 * fadeIn) + ")"; c.lineWidth = (5 + f * 20) * k; }
        else { c.strokeStyle = "rgba(255," + Math.round(150 + 95 * f) + "," + Math.round(40 + 150 * f) + "," + (f * fadeIn) + ")"; c.lineWidth = (1.4 + f * 6.5) * k; }
        c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      }
    }
    const [hx, hy] = P.pt(cm.s), hr = 38 * k;
    const g = c.createRadialGradient(hx, hy, 0, hx, hy, hr);
    g.addColorStop(0, "rgba(255,255,255," + fadeIn + ")"); g.addColorStop(.14, "rgba(255,245,200," + fadeIn + ")");
    g.addColorStop(.34, "rgba(255,200,80," + .6 * fadeIn + ")"); g.addColorStop(.65, "rgba(255,140,30," + .2 * fadeIn + ")"); g.addColorStop(1, "rgba(255,110,20,0)");
    c.fillStyle = g; c.beginPath(); c.arc(hx, hy, hr, 0, Math.PI * 2); c.fill();
    if(B.sparks.length < 260){
      for(let q = 0; q < 2; q++){
        const [px, py] = P.pt(cm.s - rnd(0, 6));
        B.sparks.push({ x:px, y:py, vx:rnd(-2, 2) * k, vy:rnd(-2.4, 1) * k, g:.09, life:rnd(14, 30), max:30, c:pick(WARM) });
      }
    }
  }
}
// 박스 파동 · 불티 · 섬광 (박스 캔버스 안에서, 가장자리에서는 부드럽게 사라짐)
function drawBoxExtras(B){
  const c = B.ctx, P = B.path;
  for(const p of B.pulses){
    p.life--; p.d += 1.05 * B.k;
    const a = p.life / p.max, o = p.d;
    c.strokeStyle = "rgba(255,200,90," + a * .8 + ")"; c.lineWidth = (2 + 4 * a) * B.k;
    rrStroke(c, P.x - o, P.y - o, P.w + o * 2, P.h + o * 2, P.r + o * .6);
  }
  B.pulses = B.pulses.filter(p => p.life > 0);
  for(const s of B.sparks){
    s.vy += s.g; s.vx *= .97; s.x += s.vx; s.y += s.vy; s.life--;
    const edge = Math.min(s.x, s.y, B.cw - s.x, B.ch - s.y);
    const a = Math.max(0, Math.min(1, s.life / (s.max * .5))) * Math.max(0, Math.min(1, edge / 22));
    if(a <= 0) continue;
    c.strokeStyle = hexA(s.c, a); c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(s.x - s.vx * 2, s.y - s.vy * 2); c.lineTo(s.x, s.y); c.stroke();
  }
  B.sparks = B.sparks.filter(s => s.life > 0 && s.x > -4 && s.x < B.cw + 4 && s.y < B.ch + 4);
  drawFlashes(c, B.flashes);
  B.flashes = B.flashes.filter(f => f.life > 0);
}

/* ---------- 하늘 레이어 공용 ---------- */
function drawSparks(ctx, arr){
  for(const s of arr){
    s.vy += s.g; s.vx *= .97; s.x += s.vx; s.y += s.vy; s.life--;
    const L = s.len || 2;
    ctx.strokeStyle = hexA(s.c, Math.max(0, Math.min(1, s.life / (s.max * .5))));
    ctx.lineWidth = s.len ? 1.8 : 1.6;
    ctx.beginPath(); ctx.moveTo(s.x - s.vx * L, s.y - s.vy * L); ctx.lineTo(s.x, s.y); ctx.stroke();
  }
  return arr.filter(s => s.life > 0 && s.y < innerHeight + 20);
}
function drawFlashes(ctx, arr){
  for(const f of arr){
    const kk = f.life / f.max, g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.rad);
    g.addColorStop(0, "rgba(255,245,220," + .5 * kk + ")"); g.addColorStop(.35, "rgba(255,190,90," + .22 * kk + ")"); g.addColorStop(1, "rgba(255,150,40,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.rad, 0, Math.PI * 2); ctx.fill();
    f.life--;
  }
}

function fxLoop(){
  if(!FXS) return;
  const F = FXS, now = performance.now();
  sctx.setTransform(fxs.width / innerWidth, 0, 0, fxs.height / innerHeight, 0, 0);
  sctx.clearRect(0, 0, innerWidth, innerHeight);
  sctx.globalCompositeOperation = "lighter"; sctx.lineCap = "round"; sctx.lineJoin = "round";
  const t = Math.min(1, (now - F.t0) / F.lap), fadeIn = Math.min(1, (now - F.t0) / 220);

  /* ===== 이름 박스 빛줄기 (각 박스 캔버스) ===== */
  const live = F.boxes.filter(B => B.cv.isConnected);
  for(const B of live){ prepBox(B); drawBox(B, t, fadeIn); }
  if(t >= 1 && !F.launched){ F.launched = true; ignite(F); }
  for(const B of live) drawBoxExtras(B);

  /* ===== 하늘의 불꽃놀이 ===== */
  for(const r of F.rockets){
    r.t++; r.vy += r.g; r.x += r.vx; r.y += r.vy;
    r.trail.push([r.x, r.y]); if(r.trail.length > 16) r.trail.shift();
    for(let q = 1; q < r.trail.length; q++){
      const f = q / r.trail.length;
      sctx.strokeStyle = "rgba(255,214,140," + f * .95 + ")"; sctx.lineWidth = 1 + f * 3;
      sctx.beginPath(); sctx.moveTo(r.trail[q - 1][0], r.trail[q - 1][1]); sctx.lineTo(r.trail[q][0], r.trail[q][1]); sctx.stroke();
    }
    if(Math.random() < .8) F.skySparks.push({ x:r.x, y:r.y, vx:rnd(-.9, .9), vy:rnd(0, 1.6), g:.05, life:rnd(10, 22), max:22, c:"#FFD166" });
    if(r.t >= r.T){ r.dead = true; burst(r.x, r.y, r.kind || "peony"); }
  }
  F.rockets = F.rockets.filter(r => !r.dead);

  const born = [];
  for(const p of F.parts){
    p.trail.push([p.x, p.y]); if(p.trail.length > p.tl) p.trail.shift();
    p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life--;
    if(p.shed && Math.random() < .35) F.skySparks.push({ x:p.x, y:p.y, vx:rnd(-.4, .4), vy:rnd(0, .7), g:.03, life:rnd(12, 26), max:26, c:"#FFE8A3" });
    if(p.split && p.life < p.max * .48){
      p.life = 0;
      for(let q = 0; q < 4; q++){ const a = q / 4 * Math.PI * 2 + Math.PI / 4, sp = 3.4 * fxScale();
        born.push(P0(p.x, p.y, Math.cos(a) * sp + p.vx * .3, Math.sin(a) * sp + p.vy * .3, { c:p.split, w:2, life:rnd(34, 48), max:48, tl:5, tw:true })); }
    }
    if(p.crackle && p.life === 1){
      for(let q = 0; q < 3; q++){ const a = Math.random() * Math.PI * 2, sp = rnd(1.4, 2.8);
        born.push(P0(p.x, p.y, Math.cos(a) * sp, Math.sin(a) * sp, { c:"#FFFFFF", w:1.4, life:rnd(8, 14), max:14, tl:3, g:.02 })); }
    }
    let a = Math.min(1, p.life / (p.max * .45));
    if(p.tw && p.life < p.max * .5) a *= Math.random() < .5 ? .1 : 1;
    if(a <= 0) continue;
    sctx.strokeStyle = hexA(p.c, a); sctx.lineWidth = p.w;
    sctx.beginPath(); sctx.moveTo(p.trail[0][0], p.trail[0][1]);
    for(let q = 1; q < p.trail.length; q++) sctx.lineTo(p.trail[q][0], p.trail[q][1]);
    sctx.lineTo(p.x, p.y); sctx.stroke();
  }
  F.parts = F.parts.filter(p => p.life > 0);
  for(const b of born) F.parts.push(b);
  if(born.some(b => b.max === 14) && Math.random() < .15) sfx.crackle(.4);
  F.skySparks = drawSparks(sctx, F.skySparks);
  drawFlashes(sctx, F.flashes);
  F.flashes = F.flashes.filter(f => f.life > 0);

  const boxBusy = live.some(B => B.sparks.length || B.pulses.length || B.flashes.length || B.lit.some(v => v > .02));
  const busy = now - F.t0 < 7600 || boxBusy || F.rockets.length || F.parts.length || F.skySparks.length || F.flashes.length;
  if(busy) fxRaf = requestAnimationFrame(fxLoop);
  else {
    sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, fxs.width, fxs.height);
    for(const B of live){ B.ctx.setTransform(1, 0, 0, 1, 0, 0); B.ctx.clearRect(0, 0, B.cv.width, B.cv.height); }
    fxRaf = null;
  }
}

/* ============================================================
   12. 컨페티 (보조)
   ============================================================ */
const cvs = $("confetti"), ctx = cvs.getContext("2d");
let parts = [], rafId = null;
function sizeCanvas(){ cvs.width = innerWidth; cvs.height = innerHeight; }
sizeCanvas();
function confetti(count){
  const COLORS = ["#0C4DE0","#FFC53D","#F9A8C0","#FF9F1C","#FFD233","#FFFFFF","#7FA8FF"];
  for(let i = 0; i < (count || 150); i++){
    parts.push({ x:innerWidth / 2 + (Math.random() - .5) * innerWidth * .7, y:innerHeight * .3 + (Math.random() - .5) * 120,
      vx:(Math.random() - .5) * 13, vy:Math.random() * -13 - 4, w:6 + Math.random() * 8, h:8 + Math.random() * 11,
      rot:Math.random() * 6.28, vr:(Math.random() - .5) * .36, c:COLORS[(Math.random() * COLORS.length) | 0], life:150 + Math.random() * 70 });
  }
  if(!rafId) loop();
}
function loop(){
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 60);
  for(const p of parts){
    p.vy += .33; p.vx *= .995; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life / 45);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  }
  if(parts.length) rafId = requestAnimationFrame(loop); else { ctx.clearRect(0, 0, cvs.width, cvs.height); rafId = null; }
}

/* ============================================================
   13. 토스트 / 모달
   ============================================================ */
let toastTimer = null;
function toast(msg, warn){
  const t = $("toast"); t.textContent = msg; t.className = "show" + (warn ? " warn" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "", 2800);
}
let modalOk = null, modalCancel = null;
function confirmModal(title, body, onOk){ openModal(title, body, "확인", onOk, "취소", null); }
function choiceModal(title, body, okLabel, onOk, altLabel, onAlt){ openModal(title, body, okLabel, onOk, altLabel, onAlt); }
function openModal(title, body, okLabel, onOk, cancelLabel, onCancel){
  $("mTitle").textContent = title; $("mBody").textContent = body;
  $("mOk").textContent = okLabel; $("mCancel").textContent = cancelLabel;
  modalOk = onOk; modalCancel = onCancel; $("modal").classList.add("show");
}
function closeModal(){ $("modal").classList.remove("show"); modalOk = null; modalCancel = null; }

/* ============================================================
   14. 결과 내보내기
   ============================================================ */
function exportCSV(){
  if(!S.rounds.length){ toast("저장할 당첨자가 없습니다", true); return; }
  const rows = [["순번","경품/등수","이름","소속","사번","추첨시각","재추첨여부"]];
  let i = 1;
  const p2 = v => String(v).padStart(2, "0");
  S.rounds.forEach(r => {
    const t = new Date(r.drawnAt);
    const ts = t.getFullYear() + "-" + p2(t.getMonth() + 1) + "-" + p2(t.getDate()) + " " + p2(t.getHours()) + ":" + p2(t.getMinutes()) + ":" + p2(t.getSeconds());
    r.winners.forEach(w => rows.push([i++, r.prizeLabel, w.name, w.dept, w.empNo, ts, r.retried ? "재추첨" : ""]));
  });
  const csv = rows.map(r => r.map(c => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  const blob = new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a"), d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = "경품추첨_당첨자_" + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + ".csv";
  a.click(); URL.revokeObjectURL(a.href);
  toast("CSV 파일을 저장했습니다");
}
function showFinale(){
  if(!S.rounds.length){ toast("당첨자가 없습니다", true); return; }
  const g = $("finaleGrid"); g.innerHTML = "";
  S.rounds.forEach(r => r.winners.forEach(w => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = '<div class="r"></div><div class="n"></div><div class="d"></div>';
    c.querySelector(".r").textContent = r.prizeLabel;
    c.querySelector(".n").textContent = w.display || w.name;
    c.querySelector(".d").textContent = [w.dept, w.empNo].filter(Boolean).join(" · ");
    g.appendChild(c);
  }));
  $("finale").classList.add("show"); confetti();
}

/* ============================================================
   15. 저장 / 복구
   ============================================================ */
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({ participants:S.participants, rounds:S.rounds, settings:S.settings, prize:$("prizeLabel").value, count:getCount() })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.participants) || !d.participants.length) return false;
    S.participants = d.participants; S.rounds = d.rounds || [];
    S.settings = Object.assign(S.settings, d.settings || {});
    $("prizeLabel").value = d.prize || "1등 · 경품";
    $("winCount").value = d.count || 3;
    $("roster").value = S.participants.map(p => [p.name, p.dept, p.empNo].filter(Boolean).join("\t")).join("\n");
    return true;
  }catch(e){ return false; }
}
function resetAll(){
  confirmModal("전체 초기화", "명단과 당첨자 기록이 모두 삭제됩니다. 저장하지 않은 결과는 복구할 수 없습니다.", () => {
    S.participants = []; S.rounds = []; S.pending = null; S.retryCount = 0;
    $("roster").value = "";
    try{ localStorage.removeItem(KEY); }catch(e){}
    clearWinFx(); buildReels(getCount(), null); render(); setControls(); syncStage();
    toast("초기화했습니다"); say("명단을 넣어주세요!");
  });
}

/* ============================================================
   16. 이벤트
   ============================================================ */
$("btnRegister").onclick = registerRoster;
$("btnClearRoster").onclick = () => { $("roster").value = ""; };
$("btnSpin").onclick = spin;
$("lever").onclick = spin;
$("btnConfirm").onclick = confirmRound;
$("btnRetry").onclick = retryRound;
$("btnCsv").onclick = exportCSV;
$("btnFinale").onclick = showFinale;
$("btnReset").onclick = resetAll;
$("finaleClose").onclick = () => $("finale").classList.remove("show");
$("mCancel").onclick = () => { const f = modalCancel; closeModal(); if(f) f(); };
$("mOk").onclick = () => { const f = modalOk; closeModal(); if(f) f(); };
$("cntMinus").onclick = () => setCount(getCount() - 1);
$("cntPlus").onclick = () => setCount(getCount() + 1);
$("winCount").oninput = () => { syncStage(); refreshChips(); };
$("winCount").onblur = () => setCount(getCount());
$("prizeLabel").oninput = syncStage;

function setCount(n){
  n = Math.max(1, Math.min(10, n)); $("winCount").value = n;
  syncStage(); refreshChips(); save();
  if(!S.spinning && !S.pending){ clearWinFx(); buildReels(n, null); }
}
function refreshChips(){ const n = getCount(); document.querySelectorAll("#cntChips .chip").forEach(c => c.classList.toggle("on", +c.dataset.n === n)); }
document.querySelectorAll("#cntChips .chip").forEach(c => c.onclick = () => setCount(+c.dataset.n));
document.querySelectorAll("#speedChips .chip").forEach(c => c.onclick = () => {
  S.settings.speed = c.dataset.s;
  document.querySelectorAll("#speedChips .chip").forEach(x => x.classList.toggle("on", x === c)); save();
});
function bindSwitch(id, key, after){
  $(id).onclick = function(){ S.settings[key] = !S.settings[key]; this.classList.toggle("on", S.settings[key]); if(after) after(); save(); };
}
bindSwitch("swExclude", "exclude", render);
bindSwitch("swSound", "sound", () => { if(!S.settings.sound) whirr(false); });
bindSwitch("swIntro", "intro");
$("btnPanel").onclick = () => { document.body.classList.toggle("stage-mode"); relayout(); };
$("btnStage").onclick = toggleStage;
function toggleStage(){
  const onn = !document.body.classList.contains("stage-mode");
  document.body.classList.toggle("stage-mode", onn);
  if(onn && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  else if(!onn && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  relayout();
}
function relayout(){ [0, 80, 180, 300, 400].forEach(t => setTimeout(() => { fitStage(); snapReels(); }, t)); }
let resizeTimer = null;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { fitStage(); snapReels(); sizeCanvas(); sizeFx(); }, 90);
});
document.addEventListener("fullscreenchange", relayout);
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(e.key === "Escape"){
    if($("modal").classList.contains("show")){ closeModal(); return; }
    if($("finale").classList.contains("show")){ $("finale").classList.remove("show"); return; }
    if($("intro").classList.contains("show")) return;
    document.body.classList.toggle("stage-mode"); relayout(); return;
  }
  if(typing) return;
  if(e.code === "Space"){ e.preventDefault(); if(S.pending) return; spin(); }
  else if(e.key === "Enter"){ if(S.pending) confirmRound(); }
  else if(e.key === "r" || e.key === "R"){ if(S.pending) retryRound(); }
  else if(e.key === "f" || e.key === "F"){ toggleStage(); }
});

/* ============================================================
   17. 시작
   ============================================================ */
(function init(){
  const restored = load();
  $("swExclude").classList.toggle("on", S.settings.exclude);
  $("swSound").classList.toggle("on", S.settings.sound);
  $("swIntro").classList.toggle("on", S.settings.intro);
  document.querySelectorAll("#speedChips .chip").forEach(x => x.classList.toggle("on", x.dataset.s === S.settings.speed));
  refreshChips(); syncStage(); render(); setControls();
  buildReels(getCount(), null);
  relayout();
  setTimeout(() => {
    if(restored){ say("이어서 진행할 수 있어요 (" + pool().length + "명 남음)"); toast("이전 진행 상태를 복구했습니다"); }
    else say("명단을 넣어주세요!");
  }, 600);
})();
</script>
